name: Gunluk Dil Verisi Guncelleme

on:
  schedule:
    - cron: '0 0 * * *'  # Her gece yarısı otomatik çalışır
  workflow_dispatch:      # İstendiğinde elle çalıştırılabilir

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Depoyu Klonla
        uses: actions/checkout@v4

      - name: Python Kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Gunun Kelimesini Guncelle
        run: python scraper.py

      - name: Degisiklikleri Kaydet ve Repoya Yukle
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git commit -m "Otomatik gunun kelimesi guncellemesi [skip ci]" || exit 0
          git push 